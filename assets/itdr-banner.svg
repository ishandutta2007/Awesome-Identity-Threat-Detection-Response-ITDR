<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberMesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe; #38ef7d; #00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe; #00f2fe; #4facfe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0; #f72585; #9b51e0" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(380px); }
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind and around foreground text) -->
  
  <!-- Subtle Scanning Laser Line -->
  <g opacity="0.35">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f2fe" stroke-width="1.5" filter="url(#subtleGlow)">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="0,360" dur="4.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Dynamic Graph Network Nodes (Background - Left Side) -->
  <g opacity="0.4">
    <!-- Graph Links -->
    <line x1="90" y1="90" x2="160" y2="160" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;16" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="160" x2="100" y2="250" stroke="#4facfe" stroke-width="1" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="2.5s" repeatCount="indefinite" />
    </line>
    <line x1="160" y1="160" x2="230" y2="120" stroke="#7000ff" stroke-width="1" />
    <line x1="100" y1="250" x2="190" y2="280" stroke="#00f2fe" stroke-width="1" />

    <!-- Graph Nodes -->
    <circle cx="90" cy="90" r="5" fill="#00f2fe" filter="url(#subtleGlow)">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="160" r="7" fill="#4facfe" filter="url(#subtleGlow)">
      <animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="250" r="5" fill="#38ef7d" filter="url(#subtleGlow)" />
    <circle cx="230" cy="120" r="4" fill="#9b51e0" />
    <circle cx="190" cy="280" r="6" fill="#00f2fe" filter="url(#subtleGlow)" />
  </g>

  <!-- Dynamic Graph Network Nodes (Background - Right Side) -->
  <g opacity="0.4">
    <!-- Graph Links -->
    <line x1="1080" y1="100" x2="1010" y2="180" stroke="#7000ff" stroke-width="1" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="0;16" dur="2.8s" repeatCount="indefinite" />
    </line>
    <line x1="1010" y1="180" x2="1100" y2="260" stroke="#00f2fe" stroke-width="1" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="2.2s" repeatCount="indefinite" />
    </line>
    <line x1="1010" y1="180" x2="930" y2="130" stroke="#4facfe" stroke-width="1" />
    <line x1="1100" y1="260" x2="1020" y2="290" stroke="#f72585" stroke-width="1" />

    <!-- Graph Nodes -->
    <circle cx="1080" cy="100" r="5" fill="#9b51e0" filter="url(#subtleGlow)">
      <animate attributeName="r" values="4;7;4" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1010" cy="180" r="7" fill="#00f2fe" filter="url(#subtleGlow)">
      <animate attributeName="r" values="6;9;6" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="260" r="5" fill="#f72585" filter="url(#subtleGlow)" />
    <circle cx="930" cy="130" r="4" fill="#4facfe" />
    <circle cx="1020" cy="290" r="6" fill="#00f2fe" filter="url(#subtleGlow)" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="320" cy="80" r="2" fill="#00f2fe" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="880" cy="75" r="2.5" fill="#4facfe" opacity="0.5">
    <animate attributeName="cy" values="75;95;75" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="300" r="2" fill="#38ef7d" opacity="0.4">
    <animate attributeName="cx" values="450;465;450" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="310" r="2" fill="#9b51e0" opacity="0.5">
    <animate attributeName="cx" values="750;735;750" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- FOREGROUND CONTENT CONTAINER (Clear, uncluttered, always in foreground) -->
  <g id="foreground">
    
    <!-- Top Cyber Tag / Category Pill -->
    <g transform="translate(425, 42)">
      <rect width="350" height="30" rx="15" fill="url(#badgeGradient)" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" filter="url(#subtleGlow)" />
      <circle cx="18" cy="15" r="4" fill="#00f2fe">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" class="mono" font-size="11.5" font-weight="700" fill="#00f2fe" letter-spacing="2">ZERO TRUST &amp; IDENTITY DEFENSE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" class="sans" text-anchor="middle" font-size="44" font-weight="900" fill="url(#titleGradient)" letter-spacing="-0.5" filter="url(#neonGlow)">
      IDENTITY THREAT DETECTION &amp; RESPONSE
    </text>

    <!-- Secondary Acronym Highlight -->
    <text x="600" y="172" class="mono" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="6">
      [ ITDR &bull; ATTACK PATH MANAGEMENT &bull; IAM SHIELD ]
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="218" class="sans" text-anchor="middle" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Security Engines
    </text>

    <!-- Feature Attribute Pills (Foreground, cleanly positioned) -->
    <g transform="translate(190, 260)">
      <!-- Pill 1: Attack Path Analysis -->
      <g transform="translate(0, 0)">
        <rect width="185" height="38" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1.2" />
        <rect width="185" height="38" rx="8" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.5" />
        <text x="18" y="24" font-size="15">&#x1F6E1;&#xFE0F;</text>
        <text x="44" y="24" class="sans" font-size="12.5" font-weight="600" fill="#e2e8f0">Attack Path Graphing</text>
      </g>

      <!-- Pill 2: Runtime Access Protection -->
      <g transform="translate(205, 0)">
        <rect width="200" height="38" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1.2" />
        <rect width="200" height="38" rx="8" fill="none" stroke="#4facfe" stroke-width="1.2" stroke-opacity="0.5" />
        <text x="18" y="24" font-size="15">&#x26A1;</text>
        <text x="44" y="24" class="sans" font-size="12.5" font-weight="600" fill="#e2e8f0">Runtime Auth Firewalls</text>
      </g>

      <!-- Pill 3: Anomaly Detection -->
      <g transform="translate(425, 0)">
        <rect width="185" height="38" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1.2" />
        <rect width="185" height="38" rx="8" fill="none" stroke="#38ef7d" stroke-width="1.2" stroke-opacity="0.5" />
        <text x="18" y="24" font-size="15">&#x1F9E0;</text>
        <text x="44" y="24" class="sans" font-size="12.5" font-weight="600" fill="#e2e8f0">Behavioral ML Models</text>
      </g>

      <!-- Pill 4: AD & Cloud Resilience -->
      <g transform="translate(630, 0)">
        <rect width="190" height="38" rx="8" fill="#131d33" stroke="#1e293b" stroke-width="1.2" />
        <rect width="190" height="38" rx="8" fill="none" stroke="#9b51e0" stroke-width="1.2" stroke-opacity="0.5" />
        <text x="18" y="24" font-size="15">&#x1F504;</text>
        <text x="44" y="24" class="sans" font-size="12.5" font-weight="600" fill="#e2e8f0">AD &amp; Cloud Resilience</text>
      </g>
    </g>

    <!-- Bottom Accent Border Glow -->
    <line x1="200" y1="358" x2="1000" y2="358" stroke="url(#cyberMesh)" stroke-width="2" filter="url(#neonGlow)" />
  </g>
</svg>
